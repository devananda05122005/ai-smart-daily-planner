<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Planner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>AI Smart Daily Planner</h1>
    
    <input type="text" id="taskName" placeholder="Task Name">
    <input type="text" id="deadline" placeholder="Deadline (e.g., 5 PM)">
    <input type="text" id="duration" placeholder="Duration (e.g., 1.5 hours)">
    
    <select id="priority">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
    </select>
    
    <button onclick="addTask()">Add Task</button>
    
    <textarea id="freeTime" placeholder="Enter comma-separated time blocks (Example: 9 AM - 12 PM, 1 PM - 5 PM, 6 PM - 9 PM)"></textarea>
    
    <h2>Task List</h2>
    <ul id="taskList"></ul>
    
    <button onclick="optimizeTasks()">Optimize Schedule</button>
    
    <div id="result"></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
